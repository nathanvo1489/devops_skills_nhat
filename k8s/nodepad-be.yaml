apiVersion: apps/v1
kind: Deployment

metadata:
    name: nodepad-be

spec:
    replicas: 1

    selector:
        matchLabels:
            app: nodepad-be

    template:
        metadata:
            labels:
                app: nodepad-be

        spec:
            containers:
                - name: nodepad-be
                  image: vulebaolong/img-nodepad_be:latest
                  imagePullPolicy: Always

                  ports:
                      - containerPort: 8888

                  envFrom:
                      - secretRef:
                            name: nodepad-be-env

                  resources:
                      requests:
                          cpu: 300m
                          memory: 128Mi
                      limits:
                          cpu: "1"
                          memory: 384Mi

---
apiVersion: v1
kind: Service

metadata:
    name: nodepad-be-service

spec:
    type: ClusterIP

    selector:
        app: nodepad-be

    ports:
        - port: 8888
          targetPort: 8888

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: nodepad-be-hpa
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: nodepad-be

    minReplicas: 1
    maxReplicas: 15

    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: nodepad-be-ingress
    namespace: default

spec:
    ingressClassName: nginx

    tls:
        - hosts:
              - nodepad-be.vulebaolong.com
          secretName: vulebaolong.com

    rules:
        - host: nodepad-be.vulebaolong.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: nodepad-be-service
                            port:
                                number: 8888
