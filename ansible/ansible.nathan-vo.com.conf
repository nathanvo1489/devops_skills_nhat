server {
        listen 80;
        listen [::]:80;
        server_name ansible.nathan-vo.com;
        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name ansible.nathan-vo.com;

        ssl_certificate /etc/nginx/ssl/nathan-vo.com.crt;
        ssl_certificate_key /etc/nginx/ssl/nathan-vo.com.key;

        root /;
        index index.html;

        location / {
                try_files $uri $uri/ =404;
        }
}
