upstream backend {
        # server 127.0.0.1:5001;
        # server 127.0.0.1:5002;
        # server [IP_Private]:5003;
        # least_conn; ưu tiên những backend ít connect
        # ip_hash;
        server 172.31.9.71:8080;
        server 172.31.1.37:8080;
        server 127.0.0.1:5003;
}

server {
        listen 80;
        listen [::]:80;
        server_name load-balancer.nathan-vo.com;
        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name load-balancer.nathan-vo.com;

        ssl_certificate /etc/nginx/ssl/nathan-vo.com.crt;
        ssl_certificate_key /etc/nginx/ssl/nathan-vo.com.key;

        location / {
                proxy_pass  http://backend;
                include proxy_params;
        }
}
