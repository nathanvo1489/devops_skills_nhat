
server {
        listen 80;
        listen [::]:80;

        server_name html.nathan-vo.com;

        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name html.nathan-vo.com;

        ssl_certificate /etc/nginx/ssl/nathan-vo-public.crt;
        ssl_certificate_key /etc/nginx/ssl/nathan-vo-private.key;

        location / {
                proxy_pass  http://0.0.0.0:3002;
                include proxy_params;
        }
}

